<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Pad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🥁 Sound&nbsp;Pad</div>
    <nav class="instruments">
      <div class="instruments" id="trackTabs"><!-- one tab per track, built by app.js --></div>
      <div class="add-track">
        <button class="inst add" id="addTrackBtn" title="Add an instrument track">+ Add track</button>
        <div class="add-menu hidden" id="addMenu"><!-- built by app.js --></div>
      </div>
      <button class="inst song-tab" id="songTab" title="Arrange parts on the timeline">♫ Song</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <!-- Transport -->
    <section class="transport">
      <button id="playBtn" class="tbtn play" title="Play / Stop (Space)">▶</button>
      <button id="recBtn" class="tbtn rec" title="Arm recording (R)">● REC</button>
      <button id="clearBtn" class="tbtn" title="Clear the open part (or the timeline in Song)">Clear</button>

      <span class="position" id="position">Bar 1 · 1</span>

      <label class="ctrl">
        <span>Tempo</span>
        <input id="bpm" type="number" min="40" max="240" value="120" />
        <em>BPM</em>
      </label>

      <label class="ctrl slider">
        <span>Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" />
      </label>

      <span class="hint" id="statusHint"><!-- set by app.js --></span>
      <div class="audio-warn hidden" id="audioWarn" role="alert">
        <span id="audioWarnText"></span>
        <button id="audioRestart" class="tbtn small">Restart audio</button>
      </div>
    </section>

    <!-- Active track: its sound + its parts -->
    <section class="partbar" id="partBar">
      <div class="trackbar">
        <span class="tb-name" id="tbName">Track</span>
        <label class="mini-ctrl" title="The track's sound — notes and parts stay as they are">Sound
          <select id="tbPreset"><!-- built by app.js --></select>
        </label>
        <span class="tb-spacer"></span>
        <button id="tbRename" class="tbtn small">Rename track</button>
        <button id="tbDelete" class="tbtn small danger">Delete track</button>
      </div>
      <div class="partrow">
        <span class="pb-label" id="pbTrack">Parts</span>
        <div class="pb-chips" id="pbChips"><!-- built by app.js --></div>
        <div class="pb-actions">
          <button id="pbNew" class="tbtn small" title="New empty part">+ New</button>
          <button id="pbDup" class="tbtn small" title="Copy this part">Duplicate</button>
          <button id="pbRename" class="tbtn small">Rename</button>
          <button id="pbDelete" class="tbtn small danger">Delete</button>
        </div>
      </div>
    </section>

    <!-- Track editors (one visible at a time; all tracks play together) -->
    <div id="views"><!-- one .inst-view per track, built by app.js --></div>

    <!-- Song timeline -->
    <div id="songView" class="hidden"><!-- built by SongView --></div>

    <!-- Saved projects -->
    <section class="library">
      <div class="lib-head">
        <h2>Saved Projects</h2>
        <div class="save-row">
          <input id="seqName" type="text" placeholder="Name this song…" maxlength="40" />
          <button id="saveBtn" class="tbtn save">💾 Save</button>
        </div>
      </div>
      <p class="store-note" id="storeNote"><!-- set by app.js --></p>
      <ul class="lib-list" id="libList"><!-- built by app.js --></ul>
    </section>
  </main>

  <footer class="footer">
    <span>Vanilla Web Audio · no install · works offline</span>
    <span class="kbd-help">Keys: <b>Space</b> play · <b>R</b> record · pad keys shown on each pad</span>
  </footer>

  <script src="js/engine.js"></script>
  <script src="js/instruments.js"></script>
  <script src="js/drums.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/guitar.js"></script>
  <script src="js/bass-guitar.js"></script>
  <script src="js/project.js"></script>
  <script src="js/player.js"></script>
  <script src="js/param-panel.js"></script>
  <script src="js/velocity-lane.js"></script>
  <script src="js/length-ruler.js"></script>
  <script src="js/drum-view.js"></script>
  <script src="js/piano-roll.js"></script>
  <script src="js/song-view.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
